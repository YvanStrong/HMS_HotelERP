# Activate with: spring.profiles.active=prod
# HMS production-oriented defaults — always set secrets via environment / vault.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Database credentials must be supplied (no local defaults).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Required in prod (validated at startup by ProductionSecurityGuardrails).
hms.setup.token=${HMS_SETUP_TOKEN}
hms.jwt.secret=${HMS_JWT_SECRET}
hms.public.base-url=${HMS_PUBLIC_BASE_URL}
hms.frontend.base-url=${HMS_FRONTEND_BASE_URL}

# Example: https://app.yourdomain.com,https://staff.yourdomain.com
hms.cors.allowed-origins=${HMS_CORS_ALLOWED_ORIGINS}

hms.auth.password-reset.frontend-base-url=${hms.frontend.base-url}
hms.auth.password-reset.expose-reset-link-in-json=false

# Bug report inbox (falls back to HMS_MAIL_FROM / spring.mail.username)
hms.support.email=${HMS_SUPPORT_EMAIL:}
