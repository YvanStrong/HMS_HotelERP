# Local development profile defaults.
# This profile is used by default via spring.profiles.default=local in application.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:hms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:QAZwsx@123}

server.port=${SERVER_PORT:8080}

# HMS_JWT_SECRET is the current name. JWT_SECRET is accepted as a fallback for existing envs.
hms.jwt.secret=${HMS_JWT_SECRET:${JWT_SECRET:hms-local-dev-jwt-secret-replace-in-production-min-32-bytes}}
hms.setup.token=${HMS_SETUP_TOKEN:hms-local-dev-setup-token-replace-me}
hms.public.base-url=${HMS_PUBLIC_BASE_URL:http://localhost:8080}
hms.frontend.base-url=${HMS_FRONTEND_BASE_URL:http://localhost:3000}
hms.cors.allowed-origins=${HMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

hms.auth.password-reset.expose-reset-link-in-json=${HMS_PASSWORD_RESET_EXPOSE_LINK:true}
