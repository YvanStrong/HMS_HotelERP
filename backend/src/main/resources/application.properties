# HMS backend — PostgreSQL + Hibernate + Flyway. Override via environment variables.

spring.application.name=hms-backend
spring.profiles.default=local
# Load local deployment secrets from backend/.env when present. The file is ignored by git.
spring.config.import=optional:file:.env[.properties]

# Database: create empty DB in pgAdmin (default name: hms)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:QAZwsx@123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# After replacing migration files at the same version (e.g. merge), Flyway may report checksum mismatch and/or a gap
# (e.g. version 11 applied but 10 missing). From backend/: run repair, then migrate with out-of-order, then start normally:
#   mvn flyway:repair -Dflyway.url=jdbc:postgresql://localhost:5432/hms -Dflyway.user=postgres -Dflyway.password=...
#   mvn flyway:migrate -Dflyway.url=... -Dflyway.user=... -Dflyway.password=... -Dflyway.outOfOrder=true
# Or once: FLYWAY_VALIDATE_ON_MIGRATE=false to start the app, then run repair/migrate as above and remove the variable.
#
# V35 checksum mismatch (common after merge): DB applied legacy "inventory_depots ↔ inv_warehouses" as V35; main uses
# V35__group_bookings.sql and moved the link script to V48. Fix: from backend/ run flyway:repair with your DB URL/user/password,
# then restart so Flyway can migrate. If migrate failed at V41 (missing group_bookings), pull latest V41 (idempotent create)
# and run repair again, then migrate. Example:
#   mvn flyway:repair "-Dflyway.url=jdbc:postgresql://localhost:5432/hms" "-Dflyway.user=postgres" "-Dflyway.password=YOUR_PASSWORD"
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}

# When true, API check-out is the last night of stay (inclusive); stored exclusive end is next calendar day so the
# room is available from the morning after that night. When false, check-out is already the first morning not in the stay (OTA style).
hms.booking.check-out-last-night-inclusive=${HMS_CHECK_OUT_LAST_NIGHT_INCLUSIVE:false}

# Mobile POS: when true, waiters must open a shift before taking orders (per-hotel override via hotels.pos_require_shift).
hms.pos.require-shift=${HMS_POS_REQUIRE_SHIFT:true}
hms.pos.low-stock-threshold=${HMS_POS_LOW_STOCK_THRESHOLD:5}

# DND auto-clear poll (default 15 minutes)
hms.dnd.expiry-poll-ms=900000

# Room block auto-release poll (default 30 minutes)
hms.room-block.auto-release-poll-ms=1800000

# HMS API port; override with SERVER_PORT if needed.
server.port=${SERVER_PORT:8080}

# JWT: min 32 UTF-8 bytes for HS256. Set JWT_SECRET in any shared/staging/prod environment.
# Unset JWT_SECRET uses a local-only default so the app can start; override for real deployments.
# Used in invoice PDF links returned to the browser (must resolve from the client machine).
hms.public.base-url=${HMS_PUBLIC_BASE_URL}
hms.jwt.secret=${HMS_JWT_SECRET}
hms.jwt.expiration-ms=86400000
hms.jwt.access-token-expiry-ms=900000
hms.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
hms.jwt.web-access-token-expiry-ms=3600000
hms.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Login brute-force mitigation (in-memory; use Redis/WAF for multi-instance production).
hms.auth.login.max-attempts=5
hms.auth.login.window-minutes=15
hms.auth.login.lockout-minutes=15

# Self-service forgot-password: reset links target this Next.js origin. Set HMS_PASSWORD_RESET_EXPOSE_LINK=false in production.
hms.frontend.base-url=${HMS_FRONTEND_BASE_URL}
hms.auth.password-reset.frontend-base-url=${hms.frontend.base-url}
hms.auth.password-reset.expose-reset-link-in-json=${HMS_PASSWORD_RESET_EXPOSE_LINK:true}

# Comma-separated Ant-style origin patterns for browser clients (prod: set to your front-end origins).
hms.cors.allowed-origins=${HMS_CORS_ALLOWED_ORIGINS}

# Setup: Postman setupToken / X-Setup-Token must match exactly. Set SETUP_TOKEN when not using default.
hms.setup.token=${HMS_SETUP_TOKEN}

logging.level.org.hibernate.SQL=warn
logging.level.SECURITY_AUDIT=info

# Optional: create PostgreSQL schemas per tenant (tenant_<uuid>); JPA tables stay in public until migrated.
hms.multitenancy.schema-isolation-enabled=${HMS_SCHEMA_ISOLATION:false}
hms.multitenancy.schema-prefix=tenant

# Stripe (empty = billing sync jobs and webhooks no-op / 503 for webhook if secret unset)
hms.stripe.secret-key=${STRIPE_SECRET_KEY:}
hms.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# RRA EBM (VSDC/OSDC) — disabled until sandbox credentials + encryption secret are set
hms.ebm.enabled=${HMS_EBM_ENABLED:false}
hms.ebm.key-encryption-secret=${EBM_KEY_ENCRYPTION_SECRET:}
hms.ebm.country-code=RW
hms.ebm.default-item-ty-cd=2
hms.ebm.default-pkg-unit-cd=NT
hms.ebm.default-qty-unit-cd=BA
hms.ebm.outbox-poll-ms=${HMS_EBM_OUTBOX_POLL_MS:15000}
hms.ebm.sync-poll-ms=${HMS_EBM_SYNC_POLL_MS:300000}

# Provisioning job poller (ms between polls when idle)
hms.provisioning.poll-ms=${HMS_PROVISIONING_POLL_MS:5000}

# Daily UTC snapshot for platform_usage_metrics (cron)
hms.usage-metrics.cron=${HMS_USAGE_METRICS_CRON:0 45 1 * * *}

# OpenAPI / Swagger UI (http://localhost:8080/swagger-ui/index.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Guest self-order: Web Push (VAPID) and optional Twilio SMS when an order becomes READY.
# VAPID keys generated for local dev (rotate for production; prefer env vars).
hms.self-order.notify.vapid-public-key=BMmoc6P01plLu8nHub8PYY9I7XkUkqgXYF7xeQzLXf0zTOuPFGnQraLrKKMrU8uyohW5u2rqFCSIOF0R34eQXSg
hms.self-order.notify.vapid-private-key=afLobCFwKHi3ObMW29Zzomvn7F6b8cIiZ_TRLd2SAMU
hms.self-order.notify.vapid-subject=mailto:hms@localhost
# Twilio: set these env vars (or replace values) to send SMS when guests enter a phone number.
hms.self-order.notify.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
hms.self-order.notify.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
hms.self-order.notify.twilio-from-number=${TWILIO_FROM_NUMBER:}

# Outbound email. Use environment variables; never commit real mailbox passwords.
spring.mail.host=${HMS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${HMS_MAIL_PORT:587}
spring.mail.username=${HMS_MAIL_USERNAME:}
spring.mail.password=${HMS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
hms.notifications.email.enabled=${HMS_EMAIL_ENABLED:true}
hms.notifications.email.from=${HMS_MAIL_FROM:${spring.mail.username}}
# Inbox for system bug reports (falls back to mail from/username when blank)
hms.support.email=${HMS_SUPPORT_EMAIL:}

